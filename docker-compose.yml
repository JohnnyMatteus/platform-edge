# Stack local da plataforma de entrada.
#
# Profiles:
#   core          gateway (duas instâncias), Redis, stubs, Keycloak e Vault
#                 (o mínimo para os smoke tests)
#   observability Prometheus, Grafana e Jaeger
#   tools         LocalStack (Secrets Manager), alternativa comparada no ADR 0009
#
# Redes:
#   edge          rede interna deste projeto
#   portfolio-net rede compartilhada do ecossistema (external, criada por
#                 `make network`). Por ela o gateway alcança o payments-events-go
#                 e o saas-multitenant quando estão de pé (docs/rede-portfolio.md).
#
# Todas as credenciais são DEV ONLY. Variáveis e portas em .env.example.
name: platform-edge

x-stub: &stub
  build:
    context: .
    dockerfile: build/upstream-stub/Dockerfile
  image: platform-edge/upstream-stub:dev
  profiles: [core]
  healthcheck:
    test: ["CMD", "/upstream-stub", "healthcheck"]
    interval: 5s
    timeout: 10s
    retries: 10
  read_only: true
  security_opt: ["no-new-privileges:true"]
  networks: [edge]
  restart: unless-stopped

services:
  gateway:
    build: ./gateway
    image: platform-edge/gateway:dev
    profiles: [core]
    ports:
      - "${GATEWAY_PROXY_PORT:-8000}:8000"     # proxy
      - "${GATEWAY_STATUS_PORT:-8100}:8100"    # status e /metrics
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      redis: { condition: service_healthy }
      payments-stub: { condition: service_healthy }
      studios-stub: { condition: service_healthy }
    environment:
      # Dois workers bastam localmente (o padrão é um por CPU).
      KONG_NGINX_WORKER_PROCESSES: "2"
    security_opt: ["no-new-privileges:true"]
    networks: [edge, portfolio-net]
    restart: unless-stopped

  # Segunda instância, só para provar que o rate limit conta em conjunto
  # (ADR 0010). Mesma imagem do gateway, sem porta de status publicada.
  gateway-replica:
    image: platform-edge/gateway:dev
    profiles: [core]
    ports:
      - "${GATEWAY_REPLICA_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      KONG_NGINX_WORKER_PROCESSES: "2"
    security_opt: ["no-new-privileges:true"]
    networks: [edge, portfolio-net]
    restart: unless-stopped

  # Contador compartilhado do rate limit (ADR 0010). Sem AOF/RDB: perder a
  # contagem num restart só zera a janela de 1 minuto.
  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped

  # Imita o payments-events-go (projeto 1). Sem porta publicada: só o gateway alcança.
  # Expõe a saúde do Redis (redis_up) para o alerta de rate limit fora do ar.
  # Sem ele o Prometheus não vê o contador compartilhado.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

  payments-stub:
    <<: *stub
    environment:
      SERVICE_NAME: payments-events-go

  # Imita o saas-multitenant (projeto 3).
  studios-stub:
    <<: *stub
    environment:
      SERVICE_NAME: saas-multitenant

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      # Fixa o "iss" dos tokens, que o gateway confere (allowed_issuers).
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
    ports:
      - "8080:8080"
    volumes:
      # Sem volume de dados de propósito: o realm é reimportado a cada subida,
      # então o JSON versionado é sempre a fonte da verdade.
      - ./keycloak/realm-edge.json:/opt/keycloak/data/import/realm-edge.json:ro
    healthcheck:
      # A imagem não tem curl: usa /dev/tcp do bash na porta de gestão.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [edge]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18.3
    profiles: [core]
    command: ["server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add: [IPC_LOCK]
    healthcheck:
      # wget é bem mais leve que o binário do vault para um healthcheck frequente.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [edge]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [edge]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      prometheus: { condition: service_healthy }
      jaeger: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [edge]
    restart: unless-stopped

  # Alternativa ao Vault para quem mira AWS (ADR 0009). Não é usada pelo gateway.
  localstack:
    image: localstack/localstack:4.5.0
    profiles: [tools]
    environment:
      SERVICES: secretsmanager
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./init/aws:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      # Saudável só depois que os scripts de init/aws terminarem.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [edge]
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  localstack-data:

networks:
  edge:
    name: platform-edge
  portfolio-net:
    name: portfolio-net
    external: true
