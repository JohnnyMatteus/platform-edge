# Exemplo de valores de produção usado no CI (helm lint e kubeconform).
image:
  tag: "0.1.0"

declarativeConfig:
  existingConfigMap: edge-gateway-declarative

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12

podDisruptionBudget:
  minAvailable: 2

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: api.edge.example.com
  tlsSecretName: edge-gateway-tls

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

networkPolicy:
  ingressFromNamespaces: [ingress-nginx]
  upstreamNamespaces: [payments, studios]

extraEnv:
  KONG_NGINX_WORKER_PROCESSES: "4"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/instance: edge
