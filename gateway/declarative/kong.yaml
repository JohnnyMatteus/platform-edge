# Configuração declarativa do gateway (Kong OSS em modo DB-less).
# Este arquivo é a fonte da verdade das políticas de borda: rotas, JWT,
# autorização por papel, rate limit, CORS e limite de payload.
# Ver docs/roteiros/autenticacao.md e docs/roteiros/rate-limit.md.
_format_version: "3.0"
_transform: true

# Âncoras YAML (&/*) evitam repetir a chave pública e a base da política.
# O Kong rejeita chaves de topo desconhecidas, então as âncoras ficam no
# primeiro uso.

services:
  - name: payments-events-go
    url: http://payments-stub:8080
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    # Sem retry no gateway: POST de pagamento não é idempotente por padrão.
    retries: 0
    plugins:
      - name: jwt
        config: &jwt_config
          header_names: [authorization]
          uri_param_names: []
          cookie_names: []
          key_claim_name: azp
          claims_to_verify: [exp]
          maximum_expiration: 900
          run_on_preflight: false
      # Negação por padrão: rota nova sem política explícita recebe 403.
      # Esta config também é a base (&token_policy_base) das rotas.
      - name: token-policy
        config: &token_policy_base
          allowed_issuers:
            - http://localhost:8080/realms/edge
          required_audience: edge-gateway
          roles_claim: realm_access.roles
          match: any
          required_roles: [edge.deny-by-default]
    # OPTIONS nas rotas permite o preflight de CORS, respondido pelo plugin
    # cors (prioridade 2000) antes de qualquer autenticação.
    routes:
      - name: payments-read
        paths: [/payments/v1]
        methods: [GET, OPTIONS]
        strip_path: false
        plugins:
          - name: token-policy
            config:
              <<: *token_policy_base
              required_roles: [payments.read]
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded
      - name: payments-write
        paths: [/payments/v1/payments]
        methods: [POST, OPTIONS]
        strip_path: false
        plugins:
          - name: token-policy
            config:
              <<: *token_policy_base
              required_roles: [payments.write]
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded
          - name: request-size-limiting
            config:
              allowed_payload_size: 16
              size_unit: kilobytes
              require_content_length: false
      - name: payments-refunds
        paths: [/payments/v1/refunds]
        methods: [POST]
        strip_path: false
        # Sem token-policy explícita: herda a negação por padrão do serviço.
        # Mantida de propósito para que o smoke test prove o default-deny.

  - name: saas-multitenant
    url: http://studios-stub:8080
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    retries: 1
    plugins:
      - name: jwt
        config: *jwt_config
      - name: token-policy
        config:
          <<: *token_policy_base
          required_roles: [edge.deny-by-default]
    routes:
      - name: studios-read
        paths: [/studios/v1]
        methods: [GET, OPTIONS]
        strip_path: false
        plugins:
          - name: token-policy
            config:
              <<: *token_policy_base
              required_roles: [studios.read, studios.admin]
          - name: rate-limiting
            config:
              minute: 120
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded
      - name: studios-admin
        paths: [/studios/v1/admin]
        methods: [GET, POST, PUT, DELETE, OPTIONS]
        strip_path: false
        plugins:
          - name: token-policy
            config:
              <<: *token_policy_base
              required_roles: [studios.admin]
          - name: rate-limiting
            config:
              minute: 30
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded

  # Rota anônima: agenda pública dos estúdios. Sem JWT, limite por IP.
  - name: saas-multitenant-public
    url: http://studios-stub:8080
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: studios-public-schedule
        paths: [/studios/v1/public]
        methods: [GET, OPTIONS]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded

# Um consumer por client do Keycloak. O plugin jwt encontra o consumer pela
# claim "azp" (client id), o que dá rate limit por cliente sem código extra.
consumers:
  - username: studio-portal
    jwt_secrets:
      - key: studio-portal
        algorithm: RS256
        # DEV ONLY: chave pública do realm "edge" de desenvolvimento
        # (par gerado para este repositório em keycloak/dev-keys/).
        # Em ambientes reais a chave vem do JWKS do Keycloak (ADR 0002).
        rsa_public_key: &realm_public_key |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArHixFytXcQ/3B8Ba5slK
          jreIQkgm90kMML1CGe4AEZbOeOh+njI1oNkLd/hjD8DKtxzdK6gKLWenscJISI2f
          V88uGv0Hq5Inc1Vprs9td7jC3TZKmyxAo/cwT8UXXtfGRwv4TjwfQry9xZtd048S
          gThi2R/glLaERMvjDd6Uq37UGIKgf/+PfJuoaL1J3GqgK3FobQv+TQf+JMqDOSpF
          qKM3hAQfGGF9C8BDI0ffG0JRIH1eibDBKYKeo5kqFEnTyd4+nq2Kqt4+poCNSE9/
          eW34xJ0HIFrhCyC+eRb+Rk8vD2brPWAOX6KeurOoSpu9m7jXaTPwGMuIGLTnUNzo
          OwIDAQAB
          -----END PUBLIC KEY-----
  - username: payments-ops
    jwt_secrets:
      - key: payments-ops
        algorithm: RS256
        rsa_public_key: *realm_public_key
  - username: partner-batch
    jwt_secrets:
      - key: partner-batch
        algorithm: RS256
        rsa_public_key: *realm_public_key

plugins:
  # Cota contratada maior para o parceiro na rota de escrita
  # (plugin no par consumer + rota tem precedência sobre o da rota).
  - name: rate-limiting
    consumer: partner-batch
    route: payments-write
    config:
      minute: 20
      limit_by: consumer
      policy: local
      fault_tolerant: true
      hide_client_headers: false
      error_code: 429
      error_message: Rate limit exceeded
  - name: cors
    config:
      origins: [http://localhost:5173]
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-Id]
      exposed_headers:
        - RateLimit-Limit
        - RateLimit-Remaining
        - RateLimit-Reset
        - Retry-After
        - X-Kong-Request-Id
      credentials: false
      max_age: 600
      preflight_continue: false
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options:nosniff"
          - "X-Frame-Options:DENY"
          - "Referrer-Policy:no-referrer"
          - "Cache-Control:no-store"
          - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
      per_consumer: true
  - name: opentelemetry
    config:
      traces_endpoint: http://jaeger:4318/v1/traces
      resource_attributes:
        service.name: edge-gateway
      propagation:
        extract: [w3c]
        inject: [w3c]
        default_format: w3c
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
